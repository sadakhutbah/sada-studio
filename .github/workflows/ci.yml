name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # release-please opens its PR with GITHUB_TOKEN, which triggers no workflow:
  # the release-please job dispatches this workflow on the PR branch so the PR gets real checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-please:
    # Keeps the version PR up to date and, when it is merged, creates the tag vX.Y.Z and the GitHub Release.
    # A tag created with GITHUB_TOKEN triggers no workflow, so the installers below are built in this same
    # run, on the tag, when a release was just created.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"$PR" 2>/dev/null || true)
          if [ -z "$branch" ]; then echo "no release PR branch"; exit 0; fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  installers:
    # Installers for the three platforms, as workflow artifacts, when release-please has just created a
    # release or (manual fallback) on a pushed vX.Y.Z tag; the `release` job then attaches them to the
    # GitHub Release, which is the update feed of the installed applications.
    # Code signing is optional: it is switched on only when the matching secrets exist.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.created == 'true')
    needs: [check, release-please]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, args: --win }
          - { os: macos-latest, name: mac, args: --mac }
          - { os: ubuntu-latest, name: linux, args: --linux }
    runs-on: ${{ matrix.os }}
    env:
      # Certificates (base64 .p12 or URL). Empty = unsigned build. Linux is never signed.
      CSC_LINK: ${{ matrix.name == 'mac' && secrets.MAC_CSC_LINK || matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      # macOS notarization (Apple Developer Program).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the tag release-please just created, or the pushed tag
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: ffmpeg for the Windows installer (IP camera source)
        if: matrix.name == 'windows'
        run: node scripts/fetch-ffmpeg-win.mjs
      - name: ffmpeg for the macOS app (IP camera source, one binary per architecture)
        if: matrix.name == 'mac'
        run: node scripts/fetch-ffmpeg-mac.mjs
      - name: Build installers
        shell: bash
        run: |
          flags=""
          # Secrets that are not set arrive as empty strings; electron-builder then resolves an empty
          # CSC_LINK to the working directory ("not a file"), so drop every empty signing variable.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate for ${{ matrix.name }}: unsigned build."
            # macOS without a certificate: ad-hoc sign the whole bundle so it carries its bundle id
            # (otherwise only the linker signature "Electron" remains and the camera/mic permission is not remembered).
            if [ "${{ matrix.name }}" = "mac" ]; then flags="$flags -c.mac.identity=-"; fi
          elif [ "${{ matrix.name }}" = "mac" ]; then
            # Notarize only if every Apple credential is present.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              flags="$flags -c.mac.notarize=true"
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never $flags
      - uses: actions/upload-artifact@v4
        with:
          name: sada-studio-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  release:
    # Attaches every installer and latest*.yml to the GitHub Release (GITHUB_TOKEN of the workflow).
    # release-please has already created the release: only upload. On a manual tag push with no release
    # yet, create it (draft, undrafted once every asset is uploaded) so no duplicate is ever made.
    needs: [installers, release-please]
    if: "!cancelled() && needs.installers.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: feed
          pattern: sada-studio-*
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          ls -l feed
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" feed/* --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes feed/*
            gh release edit "$TAG" --draft=false
          fi
