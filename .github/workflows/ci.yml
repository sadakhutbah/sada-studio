name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  installers:
    # Installers for the three platforms, as workflow artifacts, only on vX.Y.Z tags. Nothing is published to GitHub
    # Releases (the repository is private): the `publish-feed` job copies the files to the update server.
    # Code signing is optional: it is switched on only when the matching secrets exist.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, args: --win }
          - { os: macos-latest, name: mac, args: --mac }
          - { os: ubuntu-latest, name: linux, args: --linux }
    runs-on: ${{ matrix.os }}
    env:
      # Certificates (base64 .p12 or URL). Empty = unsigned build. Linux is never signed.
      CSC_LINK: ${{ matrix.name == 'mac' && secrets.MAC_CSC_LINK || matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      # macOS notarization (Apple Developer Program).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        run: |
          flags=""
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing certificate for ${{ matrix.name }}: unsigned build."
          elif [ "${{ matrix.name }}" = "mac" ]; then
            # Notarize only if every Apple credential is present.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              flags="$flags -c.mac.notarize=true"
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never $flags
      - uses: actions/upload-artifact@v4
        with:
          name: sada-studio-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  publish-feed:
    # Copies every installer and latest*.yml to the update server (generic provider). Skipped without the secrets.
    needs: installers
    runs-on: ubuntu-latest
    env:
      UPDATE_SSH_HOST: ${{ secrets.UPDATE_SSH_HOST }}
      UPDATE_SSH_USER: ${{ secrets.UPDATE_SSH_USER }}
      UPDATE_SSH_KEY: ${{ secrets.UPDATE_SSH_KEY }}
      UPDATE_SSH_PATH: ${{ secrets.UPDATE_SSH_PATH }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: feed
          pattern: sada-studio-*
          merge-multiple: true
      - name: Upload to the update server
        run: |
          if [ -z "$UPDATE_SSH_HOST" ] || [ -z "$UPDATE_SSH_KEY" ] || [ -z "$UPDATE_SSH_PATH" ]; then
            echo "UPDATE_SSH_* secrets not set: files stay available as workflow artifacts only."
            exit 0
          fi
          install -m 600 /dev/null key
          printf '%s\n' "$UPDATE_SSH_KEY" > key
          ssh="ssh -i key -o StrictHostKeyChecking=accept-new"
          # Installers first, manifests last: a client never sees a manifest whose file is not there yet.
          rsync -av -e "$ssh" --exclude 'latest*.yml' feed/ "$UPDATE_SSH_USER@$UPDATE_SSH_HOST:$UPDATE_SSH_PATH/"
          rsync -av -e "$ssh" feed/latest*.yml "$UPDATE_SSH_USER@$UPDATE_SSH_HOST:$UPDATE_SSH_PATH/"
