appId: org.sadakhutbah.studio
productName: Sada Studio
copyright: Copyright © 2026 Sada
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Updates: a plain static HTTP directory (generic provider), so mosques never need a GitHub token and the
# repository can stay private. Override the URL per machine with SADA_STUDIO_UPDATE_URL or update.json
# (see README, « Mise à jour automatique »). CI uploads the files to that directory.
publish:
  provider: generic
  url: https://updates.sadakhutbah.org/studio/
extraResources:
  - { from: build/icon.png, to: icon.png }
mac:
  category: public.app-category.video
  icon: build/icon.icns
  # Unsigned unless a certificate is supplied (CSC_LINK); CI sets CSC_IDENTITY_AUTO_DISCOVERY=false otherwise.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Sada Studio utilise la caméra pour diffuser les directs de la mosquée.
    NSMicrophoneUsageDescription: Sada Studio utilise le microphone pour diffuser le son des directs de la mosquée.
  target:
    - { target: dmg, arch: [universal] }
    - { target: zip, arch: [universal] }
  artifactName: Sada-Studio-${version}-mac.${ext}
dmg:
  title: Sada Studio ${version}
win:
  icon: build/icon.ico
  signtoolOptions:
    publisherName: Sada
  legalTrademarks: Sada
  target:
    - { target: nsis, arch: [x64] }
  artifactName: Sada-Studio-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Sada Studio
  uninstallDisplayName: Sada Studio
  runAfterFinish: true
linux:
  icon: build/icons
  syncDesktopName: true
  category: AudioVideo
  maintainer: Sada <contact@sadakhutbah.org>
  synopsis: Diffuser khutbah et dars sans OBS
  desktop:
    entry:
      Name: Sada Studio
      Comment: Diffuser khutbah et dars sans OBS
      StartupWMClass: sada-studio
  target:
    - { target: AppImage, arch: [x64] }
  artifactName: Sada-Studio-${version}-linux.${ext}
