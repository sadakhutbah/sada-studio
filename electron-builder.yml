appId: org.sadakhutbah.studio
productName: Sada Studio
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Pas de signature pour l'instant (voir README, « Signature »).
# Mise à jour automatique : releases GitHub du dépôt (voir README, « Mise à jour automatique »).
publish:
  provider: github
  owner: sadakhutbah
  repo: sada-studio
  releaseType: release
extraResources:
  - { from: build/icon.png, to: icon.png }
mac:
  category: public.app-category.video
  identity: null
  target:
    - { target: dmg, arch: [universal] }
    - { target: zip, arch: [universal] }
  artifactName: Sada-Studio-${version}-mac.${ext}
win:
  target:
    - { target: nsis, arch: [x64] }
  signAndEditExecutable: false
  artifactName: Sada-Studio-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
